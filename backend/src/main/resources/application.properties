spring.application.name=issuetracker

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/issuetracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# debug line
# logging.level.org.hibernate.SQL=DEBUG

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=3600000

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# CSV upload limits. Boot's default is 1 MB per file, which a Mountain Project
# export passes at roughly 4,500 ticks. 25 MB covers any personal logbook.
# max-request-size is the whole multipart body, so it sits above max-file-size
# to leave room for the form overhead around the file.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
# When Tomcat rejects an upload it still has to read the rest of the request
# body before it can send a response. The default gives up after 2 MB and
# closes the connection, so the browser sees a network error instead of a 413.
# -1 means always read to the end.
server.tomcat.max-swallow-size=-1
